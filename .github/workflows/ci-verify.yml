name: CI Verify (openRuyi)

on:
  push:
    branches: ["ci/gha-verify"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Parse all SPEC build roots with modern RPM (openSUSE Tumbleweed)
        run: |
          docker run --rm -v "$PWD:/src" -w /src opensuse/tumbleweed:latest bash -c '
            set -e
            zypper -q --non-interactive install rpm-build > /dev/null
            rpm --version
            count=0
            for spec in $(find SPECS -name "*.spec" | sort); do
              if ! rpmspec -P "$spec" > /dev/null 2>/tmp/err; then
                echo "FAILED: $spec"; cat /tmp/err; exit 1
              fi
              count=$((count+1))
            done
            echo "parsed $count spec files"
          '
      - name: Summary
        run: |
          echo "spec count: $(find SPECS -name '*.spec' | wc -l)"
          ls _manifest | head -10
